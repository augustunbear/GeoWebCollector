<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Playground</title><style>
:root{font:16px/1.5 system-ui,sans-serif;color:#162337;background:#f5f7fa}*{box-sizing:border-box}main{max-width:1100px;margin:2rem auto;padding:0 1rem}header{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap}header p{color:#536379}section{background:#fff;border:1px solid #dce3ed;border-radius:12px;padding:1.25rem;margin:1rem 0;box-shadow:0 2px 8px #17233708}.grid{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2fr);gap:1rem}label{display:block;font-weight:600;margin:.6rem 0}select,textarea,button{font:inherit;border:1px solid #bac7d8;border-radius:8px;padding:.65rem}select,textarea{width:100%;background:#fff}textarea{height:260px;font:13px/1.5 ui-monospace,monospace}button{background:#1559bf;color:#fff;cursor:pointer;margin:.3rem .3rem .3rem 0}button.secondary{background:#fff;color:#1559bf}button:disabled{opacity:.55;cursor:not-allowed}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#142033;color:#ecf3ff;padding:1rem;border-radius:8px;max-height:560px;overflow:auto}small,.muted{color:#536379}.error{color:#a42424}#help{white-space:pre-wrap}#schema{font-size:.9rem}#status{font-weight:600}@media(max-width:720px){.grid{grid-template-columns:1fr}main{margin:1rem auto}textarea{height:200px}}
</style></head><body><main><header><h1>功能 Playground</h1><p>本地或私有 Codespaces · HTML 在当前环境处理</p></header><section><p id="intro">选择分类和功能，修改示例参数后运行。实时请求需要单独开启。</p><div class="grid"><div><label for="category">分类</label><select id="category"></select><label for="method">功能</label><select id="method"></select><p id="help"></p><p id="schema" class="muted"></p></div><div><label for="payload">参数（JSON）</label><textarea id="payload" spellcheck="false"></textarea><div><label><input type="checkbox" id="live"> 本次调用真实服务（仅已配置的实时功能）</label><button id="run">运行测试</button><button id="copy-request" class="secondary">复制请求</button></div></div></div></section><section><h2>结果</h2><p id="status" aria-live="polite">等待运行</p><button id="copy-response" class="secondary">复制响应</button><pre id="output">选择功能并点击“运行测试”。</pre></section></main><script src="/playground.js" defer></script></body></html>
