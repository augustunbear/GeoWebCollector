<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>API Playground</title><style>body{font:15px system-ui;background:#f7f8fa;color:#17212d;margin:0}main{max-width:1050px;margin:40px auto;padding:0 18px}header{display:flex;justify-content:space-between;align-items:center}section{background:white;border:1px solid #e1e5eb;border-radius:12px;padding:20px;margin:16px 0}select,textarea,button{font:inherit;border:1px solid #cbd5e1;border-radius:8px;padding:10px}select{width:100%}textarea{box-sizing:border-box;width:100%;height:200px;font:13px ui-monospace,monospace}button{background:#1d4ed8;color:white;cursor:pointer;padding:10px 22px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0f172a;color:#e2e8f0;border-radius:8px;padding:16px;min-height:120px}small{color:#64748b}</style><main><header><h1>API Playground</h1><small>Local-only · Explicit execution</small></header><section><label for="method">接口 / Operation</label><select id="method"></select><p id="help"></p><label for="payload">JSON 参数</label><textarea id="payload" spellcheck="false"></textarea><p><button id="run">运行测试 / Run</button> <small id="time"></small></p></section><section><h2>执行结果</h2><pre id="output">选择接口后点击运行。</pre></section></main><script>const sel=document.querySelector('#method'),payload=document.querySelector('#payload'),output=document.querySelector('#output'),help=document.querySelector('#help');let ops={};fetch('/api/operations').then(r=>r.json()).then(d=>{ops=d.operations;Object.keys(ops).forEach(k=>sel.add(new Option(k,k)));sel.onchange=()=>{payload.value=JSON.stringify(ops[sel.value].example,null,2);help.textContent=ops[sel.value].description||''};sel.onchange()}).catch(e=>output.textContent=String(e));document.querySelector('#run').onclick=async()=>{const start=performance.now();output.textContent='运行中…';try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({operation:sel.value,params:JSON.parse(payload.value)})});const j=await r.json();output.textContent=JSON.stringify(j,null,2);document.querySelector('#time').textContent=Math.round(performance.now()-start)+' ms'}catch(e){output.textContent=String(e)}}</script></html>
